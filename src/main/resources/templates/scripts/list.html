<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление скриптами - Dustybox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .script-list { margin-top: 20px; }
        .file-icon { color: #6c757d; }
        .dir-icon { color: #ffc107; }
        .actions { white-space: nowrap; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
                <span th:if="${currentPath}">
                    Скрипты: <span th:text="${currentPath}"></span>
                </span>
            <span th:unless="${currentPath}">Все скрипты</span>
        </h1>
        <a href="/swagger-ui.html" class="btn btn-outline-secondary">API Docs</a>
    </div>

    <!-- Сообщения -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Навигация -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a href="/web/scripts">Корневая</a>
            </li>
            <li th:if="${currentPath}" class="breadcrumb-item active" aria-current="page">
                <span th:text="${currentPath}"></span>
            </li>
        </ol>
    </nav>

    <!-- Кнопки управления -->
    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/web/scripts/create-directory}" method="post" class="row g-2">
                <input type="hidden" name="path" th:value="${currentPath}">
                <div class="col-auto">
                    <input type="text" name="dirName" class="form-control"
                           placeholder="Имя новой папки" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">
                        📁 Создать папку
                    </button>
                </div>
            </form>

            <hr>

            <form th:action="@{/web/scripts/upload}" method="post"
                  enctype="multipart/form-data" class="row g-2">
                <input type="hidden" name="path" th:value="${currentPath}">
                <div class="col-auto">
                    <input type="file" name="file" class="form-control" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-success">
                        📤 Загрузить файл
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Список скриптов -->
    <div class="card">
        <div class="card-header">
            <span th:text="'Файлы (' + ${scripts.size()} + ')'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Имя</th>
                    <th>Размер</th>
                    <th>Изменен</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <!-- Кнопка "Наверх" -->
                <tr th:if="${parentPath != null}">
                    <td colspan="4">
                        <a th:href="@{/web/scripts(path=${parentPath})}"
                           class="text-decoration-none">
                            ↩ На уровень выше
                        </a>
                    </td>
                </tr>

                <!-- Список файлов и папок -->
                <tr th:each="script : ${scripts}">
                    <td>
                        <span th:if="${script.isDirectory}" class="dir-icon">📁</span>
                        <span th:unless="${script.isDirectory}" class="file-icon">📄</span>

                        <a th:if="${script.isDirectory}"
                           th:href="@{/web/scripts(path=${script.relativePath})}"
                           th:text="${script.name}"
                           class="text-decoration-none ms-2">
                        </a>

                        <span th:unless="${script.isDirectory}"
                              th:text="${script.name}"
                              class="ms-2">
                                </span>
                    </td>
                    <td>
                        <span th:if="${script.isDirectory}">-</span>
                        <span th:unless="${script.isDirectory}"
                              th:text="${#numbers.formatDecimal(script.size/1024, 1, 2)} + ' KB'">
                                </span>
                    </td>
                    <td th:text="${#dates.format(script.lastModified, 'dd.MM.yyyy HH:mm')}"></td>
                    <td class="actions">
                        <!-- Для файлов -->
                        <a th:if="${!script.isDirectory}"
                           th:href="@{/web/scripts/edit(path=${script.relativePath})}"
                           class="btn btn-sm btn-outline-primary">
                            Редактировать
                        </a>

                        <!-- Кнопка удаления -->
                        <form th:action="@{/web/scripts/delete}" method="post"
                              style="display: inline-block;"
                              onsubmit="return confirm('Удалить \'' + [[${script.name}]] + '\'?');">
                            <input type="hidden" name="path" th:value="${script.relativePath}">
                            <input type="hidden" name="currentPath" th:value="${currentPath}">
                            <button type="submit" class="btn btn-sm btn-outline-danger ms-1">
                                Удалить
                            </button>
                        </form>

                        <!-- Кнопка выполнения -->
                        <a th:if="${!script.isDirectory && script.name.endsWith('.groovy')}"
                           th:href="@{/api/scripts/{name}(name=${script.relativePath})}"
                           target="_blank"
                           class="btn btn-sm btn-outline-success ms-1">
                            Выполнить
                        </a>
                    </td>
                </tr>

                <!-- Пустой список -->
                <tr th:if="${scripts.empty}">
                    <td colspan="4" class="text-center text-muted py-4">
                        Папка пуста
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Информация о базовой директории -->
    <div class="mt-3 text-muted small">
        Базовая директория: <code th:text="${@environment.getProperty('dustybox.scripts.base-dir')}"></code>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
