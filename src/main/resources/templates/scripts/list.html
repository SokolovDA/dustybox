<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление скриптами - Dustybox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .script-list { margin-top: 20px; }
        .file-icon { color: #6c757d; }
        .dir-icon { color: #ffc107; }
        .actions { white-space: nowrap; }
        .form-card .row { align-items: flex-end; }
        .form-card .form-label { font-size: 0.9rem; margin-bottom: 0.3rem; }
        .form-card .input-group { flex-wrap: nowrap; }
        .file-size { font-family: monospace; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <span th:if="${currentPath}">
                Скрипты: <span th:text="${currentPath}"></span>
            </span>
            <span th:unless="${currentPath}">Все скрипты</span>
        </h1>
        <a href="/swagger-ui.html" class="btn btn-outline-secondary">API Docs</a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a href="/web/scripts">Корневая</a>
            </li>
            <li th:if="${currentPath}" class="breadcrumb-item active" aria-current="page">
                <span th:text="${currentPath}"></span>
            </li>
        </ol>
    </nav>

    <div class="card mb-3 form-card">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <form th:action="@{/web/scripts/create-directory}" method="post" class="row g-2">
                        <input type="hidden" name="path" th:value="${currentPath}">
                        <div class="col-12">
                            <label class="form-label">Создать папку</label>
                            <div class="input-group">
                                <input type="text" name="dirName" class="form-control form-control-sm"
                                       placeholder="Имя папки" required>
                                <button type="submit" class="btn btn-outline-primary btn-sm">
                                    📁 Создать
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="col-md-4">
                    <form th:action="@{/web/scripts/create}" method="post" class="row g-2">
                        <input type="hidden" name="path" th:value="${currentPath}">
                        <div class="col-12">
                            <label class="form-label">Создать скрипт</label>
                            <div class="input-group">
                                <input type="text" name="filename" class="form-control form-control-sm"
                                       placeholder="Имя скрипта" required>
                                <button type="submit" class="btn btn-outline-success btn-sm">
                                    ➕ Создать
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="col-md-4">
                    <form th:action="@{/web/scripts/upload}" method="post"
                          enctype="multipart/form-data" class="row g-2">
                        <input type="hidden" name="path" th:value="${currentPath}">
                        <div class="col-12">
                            <label class="form-label">Загрузить файл</label>
                            <div class="input-group">
                                <input type="file" name="file" class="form-control form-control-sm" required>
                                <button type="submit" class="btn btn-outline-secondary btn-sm">
                                    📤 Загрузить
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span th:text="'Файлы (' + ${scripts != null ? scripts.size() : 0} + ')'"></span>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Имя</th>
                    <th>Размер</th>
                    <th>Изменен</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${parentPath != null}">
                    <td colspan="4">
                        <a th:href="@{/web/scripts(path=${parentPath})}"
                           class="text-decoration-none">
                            ↩ На уровень выше
                        </a>
                    </td>
                </tr>

                <tr th:each="script : ${scripts}">
                    <td>
                        <span th:if="${script.isDirectory}" class="dir-icon">📁</span>
                        <span th:unless="${script.isDirectory}" class="file-icon">📄</span>

                        <a th:if="${script.isDirectory}"
                           th:href="@{/web/scripts(path=${script.relativePath})}"
                           th:text="${script.name}"
                           class="text-decoration-none ms-2">
                        </a>

                        <span th:unless="${script.isDirectory}"
                              th:text="${script.name}"
                              class="ms-2">
                        </span>
                    </td>
                    <td>
                        <span th:if="${script.isDirectory}">-</span>
                        <span th:unless="${script.isDirectory}" class="file-size">
                            <span th:if="${script.size == 0}">0 B</span>
                            <span th:if="${script.size > 0 and script.size < 1024}">
                                [[${script.size}]] B
                            </span>
                            <span th:if="${script.size >= 1024 and script.size < 1048576}">
                                [[${#numbers.formatDecimal(script.size/1024, 1, 2)}]] KB
                            </span>
                            <span th:if="${script.size >= 1048576}">
                                [[${#numbers.formatDecimal(script.size/1048576, 1, 2)}]] MB
                            </span>
                        </span>
                    </td>
                    <td th:text="${#dates.format(script.lastModified, 'dd.MM.yyyy HH:mm')}"></td>
                    <td class="actions">
                        <a th:if="${!script.isDirectory}"
                           th:href="@{/web/scripts/edit(path=${script.relativePath}, currentPath=${currentPath})}"
                           class="btn btn-sm btn-outline-primary">
                            Редактировать
                        </a>

                        <a th:href="@{/web/scripts/rename(path=${script.relativePath}, currentPath=${currentPath})}"
                           class="btn btn-sm btn-outline-warning ms-1">
                            Переименовать
                        </a>

                        <form th:action="@{/web/scripts/delete}" method="post"
                              style="display: inline-block;"
                              onsubmit="return confirm('Удалить \'' + [[${script.name}]] + '\'?');">
                            <input type="hidden" name="path" th:value="${script.relativePath}">
                            <input type="hidden" name="currentPath" th:value="${currentPath}">
                            <button type="submit" class="btn btn-sm btn-outline-danger ms-1">
                                Удалить
                            </button>
                        </form>

                        <a th:if="${!script.isDirectory and script.name.endsWith('.groovy')}"
                           th:href="@{/api/scripts/__${script.relativePath}__}"
                           target="_blank"
                           class="btn btn-sm btn-outline-success ms-1"
                           onclick="return confirm('Выполнить скрипт \'' + [[${script.name}]] + '\'?')">
                            Выполнить
                        </a>
                    </td>
                </tr>

                <tr th:if="${scripts == null or scripts.empty}">
                    <td colspan="4" class="text-center text-muted py-4">
                        Папка пуста
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const filenameInput = document.querySelector('input[name="filename"]');
        if (filenameInput) {
            filenameInput.addEventListener('blur', function(e) {
                let value = e.target.value.trim();
                if (value && !value.endsWith('.groovy')) {
                    e.target.value = value + '.groovy';
                }
            });
        }

        // Исправляем ссылки выполнения для вложенных путей
        document.querySelectorAll('a.btn-outline-success').forEach(link => {
            const originalHref = link.getAttribute('href');
            if (originalHref && originalHref.includes('__')) {
                // Заменяем __ на / для корректного URL
                const correctedHref = originalHref.replace(/__/g, '/');
                link.setAttribute('href', correctedHref);
            }
        });
    });
</script>
</body>
</html>
